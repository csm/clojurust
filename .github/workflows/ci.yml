name: CI

on:
  pull_request:
    branches: [main]
  # Releases are cut nightly rather than per-merge, so main is verified here on
  # every push to catch a broken merge before the nightly tries to publish it.
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Build, test, lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Clojure Tests
        run: cargo run -p cljrs compile -o test-suite --test ./clojure-test-suite/test && CLJRS_GC_STATS=- ./test-suite

  wasm:
    name: WASM build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build cljrs-wasm
        run: wasm-pack build crates/cljrs-wasm --target web --no-typescript --release

  fiber-asan:
    name: Fiber AddressSanitizer (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: gc
            features: small-regex,fiber-sanitizer
          - mode: no-gc
            features: small-regex,fiber-sanitizer,no-gc
    env:
      RUSTFLAGS: -Zsanitizer=address
      # Keep the 5,000-fiber full-collection stress loop practical under ASan.
      CARGO_PROFILE_TEST_OPT_LEVEL: 1
      # no-gc deliberately retains static arenas for the process lifetime.
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: fiber-asan-${{ matrix.mode }}
      - name: Fiber stress and lifecycle tests
        run: >-
          cargo test -p cljrs-async --target x86_64-unknown-linux-gnu
          --no-default-features --features ${{ matrix.features }}
          --test fiber -- --test-threads=1
