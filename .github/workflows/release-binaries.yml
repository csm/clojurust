name: Release Binaries

# Called by nightly.yml after a release is created, or run manually to
# (re)attach binaries to an existing release.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.5)'
        required: true
        type: string
      head_sha:
        description: 'Exact commit SHA to build from (defaults to the tag)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach binaries to (e.g. v0.2.5)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — the primary server/desktop target
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz

          # Linux aarch64 — Raspberry Pi, AWS Graviton, etc.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz

          # macOS Apple Silicon (macos-latest is currently macos-15 on arm64)
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    env:
      TAG: ${{ inputs.tag }}

    steps:
      # Build from the release tag, not from main.  The nightly workflow bumps
      # every crate version in a commit that only the tag references (main's
      # manifests stay at their development version), so a checkout of
      # `head_sha` would produce binaries whose `--version` reports the
      # development version (0.1.0) instead of the release version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      # When called from the nightly workflow, make sure the tag really is the
      # commit that was tested (plus the version bump).
      - name: Verify tag descends from the tested commit
        if: inputs.head_sha != ''
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          if ! git merge-base --is-ancestor "$HEAD_SHA" HEAD; then
            echo "::error::$TAG does not descend from tested commit $HEAD_SHA"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Restore only — cache entries for release builds are written by ci.yml
      # on pushes to main, so a job that checks out a specific ref cannot
      # contaminate the shared cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: "false"

      - name: Build
        shell: bash
        run: |
          cargo build -p cljrs --release --target ${{ matrix.target }}
          # Sanity check: the binary must report the tagged version.
          BIN="target/${{ matrix.target }}/release/cljrs"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version | grep -F "${TAG#v}" \
            || { echo "::error::cljrs --version does not report ${TAG#v}"; exit 1; }

      - name: Archive and checksum (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE="cljrs-${TAG}-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" cljrs
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            # macOS ships shasum instead of sha256sum
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "cljrs-$env:TAG-${{ matrix.target }}.zip"
          Compress-Archive `
            -Path "target\${{ matrix.target }}\release\cljrs.exe" `
            -DestinationPath $archive
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Checksum (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$TAG" "$ARCHIVE" "${ARCHIVE}.sha256" --clobber
