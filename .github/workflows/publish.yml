name: Publish

on:
  push:
    branches: [main]
    # Skip publishing when a push only touches documentation or the website.
    # GitHub skips the workflow only when *every* changed file matches one of
    # these globs, so a push that also touches code still publishes. Manual
    # workflow_dispatch runs always publish, ignoring these filters.
    paths-ignore:
      - 'docs/**'
      - 'www/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BASE_VERSION: "0.1"

jobs:
  ci:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Clojure Tests
        run: cargo run -p cljrs compile -o test-suite --test ./clojure-test-suite/test && ./test-suite

  publish:
    name: Publish to crates.io
    needs: ci
    runs-on: ubuntu-latest
    # Rate-limit waits between publish attempts can add up; keep a bound well
    # above the worst case (~50 min of backoff) but below the 6 h default.
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-release
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-release

      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal --no-self-update

      - name: Set crate versions
        run: |
          VERSION="${BASE_VERSION}.${{ github.run_number }}"
          echo "Publishing version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cargo release version "$VERSION" --execute --no-confirm
          echo "--- Workspace Cargo.toml ---"
          cat Cargo.toml
          echo ""
          echo "--- Sample crate Cargo.toml ---"
          cat crates/cljrs-types/Cargo.toml
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          # Always commit the version bump so cargo publish sees a clean tree.
          # On a fresh re-run the files are re-edited from 0.1.0, so there will
          # always be staged changes to commit.
          git diff --cached --quiet || git commit -m "chore: release $VERSION"
          # Only create and push the tag if it doesn't already exist on the remote,
          # making retries safe after a partial publish failure.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists on remote — skipping tag push"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi

      # The workspace has more publishable crates than crates.io's publish
      # burst allowance, so a single `cargo publish --workspace` reliably ends
      # in a 429 with the tail of the workspace unpublished.  The script skips
      # crates already live at this version and retries the rest after waiting
      # for the rate limit to refill (honouring the retry-after timestamp
      # crates.io returns).  See .github/scripts/publish-crates.sh.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: .github/scripts/publish-crates.sh
