[package]
name = "cljrs-wasm"
version = "0.2.0"
edition = "2024"
description = "WebAssembly browser REPL for clojurust"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["regex-full", "deps"]

# Regex engine and pass-throughs. Every workspace dependency below is taken
# with default features off (see the note in the root Cargo.toml), so what
# their defaults used to provide is re-exported here and kept in `default`.
regex-full  = ["cljrs-value/regex-full", "cljrs-runtime/regex-full", "cljrs-stdlib/regex-full", "cljrs-async/regex-full"]
small-regex = ["cljrs-value/small-regex", "cljrs-runtime/small-regex", "cljrs-stdlib/small-regex", "cljrs-async/small-regex"]

# Pass-through for cljrs-runtime's git-backed dependency support.
deps = ["cljrs-runtime/deps", "cljrs-stdlib/deps", "cljrs-async/deps"]

[dependencies]
cljrs-runtime = { workspace = true }
cljrs-stdlib   = { workspace = true }
cljrs-value    = { workspace = true }
cljrs-reader   = { workspace = true }
cljrs-gc       = { workspace = true }
cljrs-types    = { workspace = true }
cljrs-async    = { workspace = true }
wasm-bindgen          = "0.2"
wasm-bindgen-futures  = "0.4"
console_error_panic_hook = "0.1"
tokio = { workspace = true, features = ["rt", "sync", "macros"] }

# Activate getrandom's JS/browser entropy source for rand on wasm32.
# rand uses getrandom 0.4; declaring it here with wasm_js unifies the feature
# across the whole dep graph when building this crate.
getrandom = { version = "0.4", features = ["wasm_js"] }

# uuid 1.22 requires an explicit randomness feature on wasm32-unknown-unknown.
# Adding the "js" feature here unifies it across the dep graph.
uuid = { version = "1.22.0", features = ["v4", "js"] }

# Browser bindings used by the `dom` module.  Target-gated because the module's
# bodies are, so a native build of this crate (which the workspace does) needs
# none of them.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version  = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "NodeList",
    "Text",
    "EventTarget",
    "Event",
    "MouseEvent",
    "KeyboardEvent",
    "InputEvent",
    "CssStyleDeclaration",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "HtmlOptionElement",
    "DomTokenList",
    "HtmlHeadElement",
    "AddEventListenerOptions",
    "console",
]
