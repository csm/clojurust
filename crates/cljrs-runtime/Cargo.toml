[package]
name = "cljrs-runtime"
version = "0.1.248"
edition = "2024"
description = "clojurust runtime: environment, builtins, tree-walking interpreter, and tiered evaluation"
license.workspace = true
repository.workspace = true

[features]
no-gc = ["cljrs-gc/no-gc", "cljrs-value/no-gc"]

[dependencies]
cljrs-types   = { workspace = true }
cljrs-gc      = { workspace = true }
cljrs-value   = { workspace = true }
cljrs-reader  = { workspace = true }
cljrs-project = { workspace = true }
cljrs-ir      = { workspace = true }
tracing      = { workspace = true }
thiserror    = "2.0.18"
num-bigint   = { workspace = true }
num-rational = { workspace = true }
bigdecimal   = { workspace = true }
num-traits   = { workspace = true }
rand         = { workspace = true }
rpds         = { workspace = true }
uuid         = { workspace = true, features = ["v4"] }
regex        = { workspace = true }

# `logging` installs a subscriber, which is a host-side concern: a wasm32
# runtime has no stderr to format to and installs none.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = { workspace = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"
